name: Agent task
description: A scoped work item for an AI agent (Claude Code or Codex)
title: "[Task] "
labels: ["status:ready"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be done and why.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and what is explicitly out of scope.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of conditions that make this task done.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands and checks that prove the change works.
      value: |
        - Local checks per AGENTS.md "Local Workflow"
        - Runtime smoke test (only if runtime behavior changes)
    validations:
      required: false
