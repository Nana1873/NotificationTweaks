name: pr-hygiene

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-hygiene:
    name: pr-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Forbidden files, conflict markers, blob size
        shell: bash
        run: |
          set -euo pipefail
          base="origin/${GITHUB_BASE_REF}"
          files=$(git diff --name-only --diff-filter=ACMR "${base}...HEAD")
          echo "Changed files:"
          echo "${files}"
          fail=0

          # Forbidden extensions, paths, and MO2 profile files
          # (AGENTS.md "Git Safety")
          bad_ext=$(echo "${files}" | grep -Ei '\.(pex|esp|esm|esl|bsa|ba2|dll|pdb|7z|zip|rar|exe)$' || true)
          bad_path=$(echo "${files}" | grep -E '^(vendor/|docs/source-docs/|build/)' || true)
          bad_name=$(echo "${files}" | grep -Ei '(^|/)(modlist|plugins|loadorder|lockedorder)\.txt$' || true)
          forbidden=$(printf '%s\n%s\n%s\n' "${bad_ext}" "${bad_path}" "${bad_name}" | sed '/^$/d')
          if [ -n "${forbidden}" ]; then
            echo "::error::Forbidden files in this PR (see AGENTS.md 'Git Safety'):"
            echo "${forbidden}"
            fail=1
          fi

          # Merge conflict markers in added lines
          markers=$(git diff --unified=0 "${base}...HEAD" | grep -E '^\+(<{7} |>{7} )' || true)
          if [ -n "${markers}" ]; then
            echo "::error::Merge conflict markers found in added lines:"
            echo "${markers}"
            fail=1
          fi

          # New/changed files larger than 2 MB
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt 2097152 ]; then
              echo "::error::File larger than 2 MB: $f (${size} bytes)"
              fail=1
            fi
          done <<< "${files}"

          exit "${fail}"

      - name: PR body links an issue
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-issue') }}
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<< "${PR_BODY}"; then
            echo "::error::PR body must contain 'Closes #<issue>'. For trivial fixes add the 'no-issue' label instead."
            exit 1
          fi
